<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="docGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Base with subtle gradient -->
  <rect width="512" height="512" rx="108" fill="url(#docGrad)" />

  <!-- Sheet of Paper Document -->
  <g filter="url(#shadow)">
    <!-- Back page sheet -->
    <rect x="136" y="86" width="240" height="340" rx="18" fill="url(#pageGrad)" />
    
    <!-- Document lines on paper -->
    <rect x="176" y="140" width="160" height="12" rx="6" fill="#94a3b8" />
    <rect x="176" y="172" width="130" height="10" rx="5" fill="#cbd5e1" />
    <rect x="176" y="200" width="150" height="10" rx="5" fill="#cbd5e1" />
    <rect x="176" y="228" width="110" height="10" rx="5" fill="#cbd5e1" />
    
    <!-- Table representation on paper -->
    <rect x="176" y="260" width="160" height="70" rx="6" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="2" />
    <line x1="176" y1="282" x2="336" y2="282" stroke="#94a3b8" stroke-width="2" />
    <line x1="230" y1="260" x2="230" y2="330" stroke="#cbd5e1" stroke-width="2" />
    <line x1="284" y1="260" x2="284" y2="330" stroke="#cbd5e1" stroke-width="2" />
  </g>

  <!-- Word Badge "W" overlapping the document -->
  <g filter="url(#shadow)">
    <rect x="96" y="220" width="150" height="150" rx="28" fill="#1e40af" stroke="#60a5fa" stroke-width="4" />
    <!-- Letter W in crisp geometry -->
    <path d="M 126 260 L 144 326 L 162 268 L 180 326 L 198 260 L 216 260 L 190 340 L 171 340 L 162 296 L 153 340 L 134 340 L 108 260 Z" fill="#ffffff" />
  </g>
</svg>
